<!-- Shared Navigation Component -->
<nav class="navbar navbar-expand-lg navbar-eco sticky-top" role="navigation" aria-label="Navigation principale">
  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/" aria-label="EcoRide - Accueil">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M216-176q-45-45-70.5-104T120-402q0-63 24-124.5T222-642q35-35 86.5-60t122-39.5Q501-756 591.5-759t202.5 7q8 106 5 195t-16.5 160.5q-13.5 71.5-38 125T684-182q-53 53-112.5 77.5T450-80q-65 0-127-25.5T216-176Zm112-16q29 17 59.5 24.5T450-160q46 0 91-18.5t86-59.5q18-18 36.5-50.5t32-85Q709-426 716-500.5t2-177.5q-49-2-110.5-1.5T485-670q-61 9-116 29t-90 55q-45 45-62 89t-17 85q0 59 22.5 103.5T262-246q42-80 111-153.5T534-520q-72 63-125.5 142.5T328-192Zm0 0Zm0 0Z"
        />
      </svg>
      <span class="fw-bold">EcoRide</span>
    </a>

    <!-- Back Button (if needed) -->
    <div *ngIf="showBackButton" class="d-lg-none">
      <a [routerLink]="backRoute" class="btn btn-outline-light btn-sm" [attr.aria-label]="'Retour vers ' + backLabel">
        <svg width="16" height="16" fill="currentColor" class="me-1" aria-hidden="true" focusable="false">
          <path d="M15.41 7.41L14 6l-6 6-6-6-1.41 1.41L8 14.83z" />
        </svg>
        {{ backLabel }}
      </a>
    </div>

    <!-- Mobile Toggle -->
    <button
      class="navbar-toggler border-0"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Ouvrir le menu de navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Menu -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Back Button for Desktop -->
      <ul *ngIf="showBackButton" class="navbar-nav me-auto d-none d-lg-flex">
        <li class="nav-item">
          <a [routerLink]="backRoute" class="nav-link" [attr.aria-label]="'Retour vers ' + backLabel">
            <svg width="16" height="16" fill="currentColor" class="me-1" aria-hidden="true" focusable="false">
              <path d="M15.41 7.41L14 6l-6 6-6-6-1.41 1.41L8 14.83z" />
            </svg>
            {{ backLabel }}
          </a>
        </li>
      </ul>

      <!-- Main Navigation -->
      <ul class="navbar-nav ms-auto align-items-center" role="menubar">
        <li class="nav-item" role="none">
          <a class="nav-link" routerLink="/search" routerLinkActive="active" role="menuitem"
            >Rechercher</a
          >
        </li>
        <li class="nav-item" role="none">
          <a
            class="nav-link"
            routerLink="/offer/create"
            routerLinkActive="active"
            role="menuitem"
            >Proposer un trajet</a
          >
        </li>
        <li class="nav-item" role="none">
          <a class="nav-link" routerLink="/about" routerLinkActive="active" role="menuitem"
            >À propos</a
          >
        </li>
        <li class="nav-item" role="none">
          <a class="nav-link" routerLink="/help" routerLinkActive="active" role="menuitem"
            >Aide</a
          >
        </li>

        <!-- User Menu -->
        <li class="nav-item dropdown" *ngIf="!isLoggedIn" role="none">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            aria-haspopup="true"
            aria-label="Menu utilisateur - Se connecter ou s'inscrire"
            id="userMenuGuest"
          >
            Mon compte
          </a>
          <ul class="dropdown-menu" aria-labelledby="userMenuGuest">
            <li>
              <a class="dropdown-item" routerLink="/auth/login" role="menuitem">Se connecter</a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/auth/register" role="menuitem"
                >S'inscrire</a
              >
            </li>
          </ul>
        </li>

        <!-- Logged In User Menu -->
        <li class="nav-item dropdown" *ngIf="isLoggedIn" role="none">
          <a
            class="nav-link dropdown-toggle d-flex align-items-center"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            aria-haspopup="true"
            [attr.aria-label]="'Menu utilisateur - ' + username"
            id="userMenuLoggedIn"
          >
            <div class="user-avatar me-2" aria-hidden="true">
              {{ username.charAt(0) }}
            </div>
            {{ username }}
          </a>
          <ul class="dropdown-menu" aria-labelledby="userMenuLoggedIn">
            <li>
              <a class="dropdown-item" routerLink="/dashboard" role="menuitem">
                <svg width="16" height="16" fill="currentColor" class="me-2" aria-hidden="true" focusable="false">
                  <path
                    d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
                  />
                </svg>
                Tableau de bord
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/profile" role="menuitem">
                <svg width="16" height="16" fill="currentColor" class="me-2" aria-hidden="true" focusable="false">
                  <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                  />
                </svg>
                Mon profil
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/messaging" role="menuitem">
                <svg width="16" height="16" fill="currentColor" class="me-2" aria-hidden="true" focusable="false">
                  <path
                    d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4l4 4 4-4h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"
                  />
                </svg>
                Messages
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" href="#" (click)="logout()" role="menuitem">
                <svg width="16" height="16" fill="currentColor" class="me-2" aria-hidden="true" focusable="false">
                  <path
                    d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                  />
                </svg>
                Se déconnecter
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
